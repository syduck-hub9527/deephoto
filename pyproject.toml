[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deephoto"
version = "0.1.0"
description = "图文 PDF RAG 智能体:上传图文交错 PDF,按知识点问答并返回原图与出处"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "numpy>=1.26",
    # deepagents 框架栈:锁定版本(md文档 00 §2),升级需先过 tests/test_deepagents_contract.py
    "deepagents==0.7.19",
    "langchain==1.4.4",
    "langgraph==1.2.14",
    "langchain-core==1.6.9",
    "langchain-openai==1.7.0",
    "langgraph-checkpoint-sqlite==3.1.1",
    "markdown-it-py>=3.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deephoto = ["web/*.html", "web/*.js", "web/vendor/katex/*", "web/vendor/katex/fonts/*"]
