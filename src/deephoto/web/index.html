<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deephoto · 图文知识库问答</title>
<style>
  :root {
    --bg: #f7f6f2; --side: #efece6; --card: #ffffff; --text: #23211c; --muted: #6f6a5e;
    --accent: #c4603f; --accent-soft: #f6e5dd; --bubble: #e9e5dc; --border: #e3ded2;
    --code-bg: #efede6; --shadow: 0 1px 3px rgba(60,50,35,.08);
  }
  :root[data-theme="dark"] {
    --bg: #1b1c20; --side: #141518; --card: #24262b; --text: #e9e7e1; --muted: #9b968a;
    --accent: #d4754e; --accent-soft: #39271f; --bubble: #2d3036; --border: #33363d;
    --code-bg: #2a2d33; --shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  button { font: inherit; cursor: pointer; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ---- 侧栏 ---- */
  #sidebar { width: 288px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--border);
             display: flex; flex-direction: column; height: 100vh; }
  .brand { padding: 18px 18px 10px; font-size: 17px; font-weight: 700; letter-spacing: .3px; }
  .brand span { color: var(--accent); }
  .side-actions { padding: 0 14px 12px; }
  #newChatBtn { width: 100%; padding: 9px; border: 1px solid var(--border); border-radius: 10px;
                background: var(--card); color: var(--text); text-align: left; }
  #newChatBtn:hover { border-color: var(--accent); color: var(--accent); }
  .side-label { padding: 8px 18px 6px; font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  #docList { flex: 1; overflow-y: auto; padding: 0 10px; }
  .doc-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 4px;
              border-radius: 8px; font-size: 13px; cursor: pointer; border: 1px solid transparent; }
  .doc-item:hover { background: var(--card); }
  .doc-item.active { background: var(--card); border-color: var(--accent); }
  .doc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.ready { background: #4caf7d; }
  .dot.pending { background: #d9a441; animation: pulse 1.2s infinite; }
  .dot.failed { background: #d05858; }
  @keyframes pulse { 50% { opacity: .35; } }
  .doc-del { border: none; background: none; color: var(--muted); padding: 0 2px; font-size: 14px;
             visibility: hidden; }
  .doc-item:hover .doc-del { visibility: visible; }
  .doc-del:hover { color: #d05858; }
  .doc-err { font-size: 11px; color: #d05858; padding: 0 10px 4px; }
  .doc-prog { font-size: 11.5px; color: var(--muted); padding: 0 10px 4px 26px; line-height: 1.5; }
  .doc-prog-toggle { color: var(--accent); text-decoration: none; margin-left: 4px; cursor: pointer; }
  .doc-prog-detail { margin: 2px 10px 8px 26px; font-size: 11.5px; color: var(--muted); }
  .prog-table { width: 100%; border-collapse: collapse; }
  .prog-table td { padding: 3px 6px 3px 0; border-bottom: 1px dashed var(--border); vertical-align: top; }
  .prog-table td:last-child { text-align: right; white-space: nowrap; }
  .prog-sub { margin: 6px 0 2px; }
  .prog-slow { margin: 0; padding-left: 16px; }
  .doc-warn { margin-top: 4px; color: var(--accent); font-size: 11.5px; }
  #uploadLabel { display: block; margin: 4px 10px 8px; padding: 9px; text-align: center; font-size: 13px;
                 border: 1px dashed var(--border); border-radius: 8px; color: var(--muted); cursor: pointer; }
  #uploadLabel:hover { border-color: var(--accent); color: var(--accent); }
  .side-foot { padding: 12px 14px; border-top: 1px solid var(--border); display: flex; gap: 6px; }
  .side-foot input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--border);
                     border-radius: 8px; background: var(--card); color: var(--text); font-size: 12px; }
  .icon-btn { border: 1px solid var(--border); background: var(--card); color: var(--text);
              border-radius: 8px; padding: 7px 10px; }

  /* ---- 主区 ---- */
  #main { flex: 1; display: flex; flex-direction: column; height: 100vh; min-width: 0; }
  #topbar { display: flex; align-items: center; gap: 10px; padding: 12px 24px;
            border-bottom: 1px solid var(--border); }
  #menuBtn { display: none; }
  #topbar .title { font-weight: 600; font-size: 15px; }
  #scope { margin-left: auto; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
           background: var(--card); color: var(--text); font-size: 13px; max-width: 260px; }

  #thread { flex: 1; overflow-y: auto; padding: 24px 16px 8px; }
  .thread-inner { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .empty { margin: auto; text-align: center; color: var(--muted); }
  .empty .logo { font-size: 42px; }
  .empty h2 { color: var(--text); font-weight: 600; margin: 10px 0 6px; }
  .empty p { font-size: 13px; line-height: 1.8; }

  .msg { display: flex; gap: 12px; }
  .msg .avatar { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex;
                 align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--bubble); color: var(--muted); }
  .msg.assistant .avatar { background: var(--accent); color: #fff; }
  .msg .body { max-width: 78%; min-width: 0; }
  .msg.user .body { background: var(--bubble); border-radius: 14px 14px 4px 14px; padding: 10px 14px; }
  .msg.assistant .body { background: transparent; }
  .msg .text { font-size: 15px; line-height: 1.8; word-break: break-word; }
  .msg.user .text { white-space: pre-wrap; }          /* 用户输入原样保留换行;助手正文走块级渲染 */
  .msg .text .md-p { margin: 0 0 .7em; }
  .msg .text .md-h { font-weight: 650; margin: .9em 0 .4em; line-height: 1.5; }
  .msg .text .md-h1 { font-size: 1.15em; } .msg .text .md-h2 { font-size: 1.08em; } .msg .text .md-h3 { font-size: 1em; }
  .msg .text .md-list { margin: 0 0 .7em; padding-left: 1.4em; }
  .msg .text .md-list li { margin: .15em 0; }
  .msg .text .md-code { background: var(--code-bg); border-radius: 6px; padding: 8px 10px; margin: 0 0 .7em;
                        font-size: 13px; white-space: pre-wrap; overflow-x: auto; }
  .msg .text > :last-child { margin-bottom: 0; }
  .msg .text code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .msg .text strong { font-weight: 650; }
  .msg.user .text { font-size: 14.5px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { display: inline-block; white-space: nowrap; font-size: 12px; line-height: 1.5; color: var(--muted);
          background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px;
          margin: 0 2px; vertical-align: baseline; text-decoration: none; }
  .chip.fig { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  a.chip.fig:hover { text-decoration: none; filter: brightness(1.1); }

  .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
              gap: 12px; margin-top: 12px; }
  .img-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
              background: var(--card); box-shadow: var(--shadow); }
  .img-card img { width: 100%; display: block; background: #fff; cursor: zoom-in; }
  .img-card figcaption { padding: 9px 12px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .img-card figcaption b { color: var(--text); font-weight: 600; }
  .img-card figcaption a { color: var(--accent); text-decoration: none; margin-left: 6px; white-space: nowrap; }

  .typing { display: inline-flex; gap: 4px; padding: 10px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
              animation: bounce 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 30% { transform: translateY(-5px); opacity: .5; } }
  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--accent);
            vertical-align: -2px; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .thinking { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); }
  .thinking summary { cursor: pointer; opacity: .8; }
  .thinking .think-body { border-left: 2px solid var(--border); padding: 4px 10px; margin-top: 6px;
                          white-space: pre-wrap; max-height: 180px; overflow-y: auto; line-height: 1.6; }

  /* ---- 输入区 ---- */
  #composer { padding: 12px 16px 18px; }
  .composer-inner { max-width: 800px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px;
                    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
                    padding: 10px 12px; box-shadow: var(--shadow); }
  .composer-inner:focus-within { border-color: var(--accent); }
  #input { flex: 1; border: none; outline: none; resize: none; background: none; color: var(--text);
           font: inherit; font-size: 15px; line-height: 1.6; max-height: 160px; }
  #sendBtn { width: 38px; height: 38px; border: none; border-radius: 50%; background: var(--accent);
             color: #fff; font-size: 17px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  #sendBtn:disabled { opacity: .45; cursor: default; }
  .hint { text-align: center; font-size: 11px; color: var(--muted); margin-top: 8px; }

  /* ---- 大图查看 ---- */
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: flex; z-index: 50;
              align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox[hidden] { display: none !important; }   /* 显式 display:flex 会顶掉 hidden 属性 */
  #lightbox img { max-width: 94vw; max-height: 94vh; }

  /* ---- 正文内嵌图片 ---- */
  .img-card.inline { margin: 12px auto; max-width: 560px; }
  .img-card.placeholder { padding: 18px 14px; text-align: center; color: var(--muted); font-size: 12.5px; }
  .img-card .img-err { padding: 14px; text-align: center; color: var(--muted); font-size: 12.5px; }
  .img-missing { margin: 8px 0; color: var(--muted); font-size: 12.5px; }
  .img-ref { margin: 2px 0 8px; }
  .supplement { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .supplement .sup-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .msg .warn { margin-top: 8px; font-size: 12.5px; color: var(--accent); }

  @media (max-width: 760px) {
    #sidebar { position: fixed; z-index: 40; left: 0; top: 0; transform: translateX(-100%);
               transition: transform .2s; }
    #sidebar.open { transform: none; }
    #menuBtn { display: inline-flex; }
    .msg .body { max-width: 88%; }
  }
</style>
</head>
<body>
<aside id="sidebar">
  <div class="brand">deep<span>photo</span></div>
  <div class="side-actions"><button id="newChatBtn" onclick="newChat()">＋ 新会话</button></div>
  <div class="side-label">文档库</div>
  <label id="uploadLabel">上传 PDF…<input type="file" id="file" accept="application/pdf" hidden></label>
  <div id="docList"></div>
  <div class="side-foot">
    <button class="icon-btn" onclick="toggleTheme()" title="切换主题" id="themeBtn">🌙</button>
  </div>
</aside>

<main id="main">
  <div id="topbar">
    <button class="icon-btn" id="menuBtn" onclick="$('sidebar').classList.toggle('open')">☰</button>
    <span class="title">图文知识库问答</span>
    <select id="scope" onchange="saveScope()"><option value="">全部文档</option></select>
  </div>
  <div id="thread"><div class="thread-inner" id="threadInner"></div></div>
  <div id="composer">
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="提问文档内容,Enter 发送,Shift+Enter 换行"></textarea>
      <button id="sendBtn" onclick="send()" title="发送">↑</button>
    </div>
    <div class="hint">回答附出处页码;涉及图形细节时会查看原图。试试“把相关图也给我看”</div>
  </div>
</main>

<div id="lightbox" hidden onclick="this.hidden = true"><img id="lightboxImg"></div>

<script src="/segments.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const SEG = DeepphotoSegments;
const STATUS_LABEL = { queued: "排队中", parsing: "解析中", describing: "描述图片", indexing: "索引中", ready: "就绪", failed: "失败" };
let messages = [];      // {role, content, citations?, images?, validated?, warning?, broken?}
let sending = false;

// ---- 初始化 ----
initTheme();
messages = SEG.restoreMessages(JSON.parse(localStorage.getItem("deephoto_chat") || "[]"));
localStorage.setItem("deephoto_chat", JSON.stringify(messages.slice(-60)));   // 持久化补齐的消息 ID
renderThread();
// docPoller 在下方"文档库"一节定义后才启动(const 暂时性死区:提前调用会中断整个初始化)

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", autoGrow);
$("file").addEventListener("change", upload);

function autoGrow() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }

// ---- 主题 ----
function initTheme() {
  const saved = localStorage.getItem("deephoto_theme");
  const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("themeBtn").textContent = dark ? "☀️" : "🌙";
}
function toggleTheme() {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  localStorage.setItem("deephoto_theme", dark ? "dark" : "light");
  $("themeBtn").textContent = dark ? "☀️" : "🌙";
}

// ---- 文档库(进度可见:阶段/计数/耗时;轮询由单一调度器维护)----
let docs = [];               // 最近一次成功获取的数据
let docsUpdatedAt = null;    // 上次成功刷新时刻(失败时据此提示,不假装实时)
let docsStale = false;
let expandedDoc = null;      // 展开了耗时详情的文档 id(每轮刷新时同步更新其详情)

const docPoller = SEG.createDocPoller({
  interval: 3000,
  load: async () => {
    const r = await fetch("/api/documents");
    if (!r.ok) throw new Error("HTTP " + r.status);
    docs = (await r.json()).documents;
    docsUpdatedAt = new Date(); docsStale = false;
    renderDocs();
    if (expandedDoc) detailLoader.refresh(expandedDoc);   // 在途去重:慢请求期间不会重复发送
    // 有未完成文档才继续轮询;全部终态则停止(详情仍可手动展开查看)
    return docs.some(d => !["ready", "failed"].includes(d.status));
  },
  onError: () => { docsStale = true; renderDocs(); },
});

function refreshDocs(immediate) {
  docPoller.start();                 // 已停止(全终态)时重新启动;运行中不叠加
  if (immediate) docPoller.tick();   // 上传/删除后立即刷新一次
}

function renderDocs() {
  const scope = localStorage.getItem("deephoto_scope") || "";
  const stale = docsStale
    ? `<div class="doc-err">进度暂时无法刷新${docsUpdatedAt ? "(上次更新 " + fmtClock(docsUpdatedAt) + ")" : ""}</div>` : "";
  $("docList").innerHTML = stale + (docs.map(d => {
    const cls = d.status === "ready" ? "ready" : d.status === "failed" ? "failed" : "pending";
    const line = SEG.progressLine(d);
    return `<div class="doc-item ${scope === d.id ? "active" : ""}" onclick="setScope('${d.id}')" title="${esc(d.filename)} · ${STATUS_LABEL[d.status] || d.status}">
        <span class="dot ${cls}"></span><span class="doc-name">${esc(d.filename)}</span>
        <button class="doc-del" onclick="event.stopPropagation(); delDoc('${d.id}')" title="删除">×</button>
      </div>
      ${line ? `<div class="doc-prog">${esc(line)}${d.progress ? ` <a class="doc-prog-toggle" data-prog="${d.id}">${expandedDoc === d.id ? "收起耗时" : "展开耗时"}</a>` : ""}</div>
      <div class="doc-prog-detail" id="prog-${d.id}" ${expandedDoc === d.id ? "" : "hidden"}>${expandedDoc === d.id ? detailInnerHtml(d.id) : ""}</div>` : ""}
      ${d.error ? `<div class="doc-err">${esc(d.error)}</div>` : ""}`;
  }).join("") || '<div class="doc-err" style="color:var(--muted)">暂无文档,先上传一份 PDF</div>');
  const ready = docs.filter(d => d.status === "ready");
  $("scope").innerHTML = '<option value="">全部文档</option>' +
    ready.map(d => `<option value="${d.id}" ${scope === d.id ? "selected" : ""}>${esc(d.filename)}</option>`).join("");
}

function fmtClock(dt) {
  const p = n => String(n).padStart(2, "0");
  return `${p(dt.getHours())}:${p(dt.getMinutes())}:${p(dt.getSeconds())}`;
}

// 耗时详情加载器:同一文档在途请求唯一;缓存上次内容,列表重建不清空;
// 失败状态按文档持久保存(见 loader.innerHtml);切换展开文档后旧请求结果不渲染
const detailLoader = SEG.createProgDetailLoader({
  fetchDetail: async (id) => {
    const r = await fetch("/api/documents/" + id);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return renderProgDetail((await r.json()).progress);
  },
  onRender: (id, html) => { const panel = $("prog-" + id); if (panel) panel.innerHTML = html; },
  // 与列表重建共用同一渲染出口:失败提示/旧内容/加载中三态由 loader.innerHtml 决定
  onError: (id) => { const panel = $("prog-" + id); if (panel) panel.innerHTML = detailLoader.innerHtml(id); },
});

function detailInnerHtml(id) { return detailLoader.innerHtml(id); }

// 展开/收起耗时详情(事件委托;只有展开时才请求细分项)
$("docList").addEventListener("click", e => {
  const t = e.target.closest("[data-prog]");
  if (!t) return;
  e.stopPropagation();
  const id = t.dataset.prog;
  if (expandedDoc === id) {
    expandedDoc = null;
    detailLoader.expanded(null);      // 收起:在途请求结果只进缓存,不再渲染
    renderDocs();
    return;
  }
  expandedDoc = id;
  detailLoader.expanded(id);          // 切换文档:此前的在途请求结果失效(仅缓存)
  renderDocs();
  detailLoader.refresh(id);
});

function renderProgDetail(p) {
  if (!p) return '<div class="doc-err" style="color:var(--muted)">无本次耗时记录</div>';
  const names = p.stage_names || {};
  const runActive = p.summary && p.summary.state === "running";
  const rows = (p.stages || []).map(s => {
    const state = SEG.PROG_STAGE_STATE[s.result] || s.result;
    // 仅"运行中的任务且该阶段仍在进行"才按 started_at 现算已等待;
    // 终态用服务端 duration_ms;中断且耗时未知的显示 —,不随时间虚涨
    const elapsed = s.duration_ms != null ? s.duration_ms
      : (runActive && s.result === "running" && s.started_at ? Date.now() - Date.parse(s.started_at) : null);
    return `<tr><td>${esc(s.display_name || names[s.stage] || s.stage)}</td>
      <td>${esc(state)}${stageCount(s)}</td><td>${SEG.formatElapsed(elapsed)}</td></tr>`;
  }).join("");
  const warns = (p.summary && p.summary.warnings || []).map(w => `<div class="doc-warn">⚠ ${esc(w)}</div>`).join("");
  return `<table class="prog-table">${rows}</table>` +
    SEG.renderChunks(p.items || []) + SEG.renderImageItems(p.items || [], runActive) +
    SEG.renderBatchItems(p.items || []) + warns;
}

function stageCount(s) {
  const c = s.counts;
  if (!c) return "";
  if (c.total) return `(${c.completed || 0}/${c.total})`;
  if (c.pages != null) return `(${c.pages} 页)`;
  if (c.chunks != null) return `(${c.chunks} 块)`;
  if (c.figures != null) return `(${c.figures} 张)`;
  return "";
}

function setScope(id) {
  const cur = localStorage.getItem("deephoto_scope") || "";
  localStorage.setItem("deephoto_scope", cur === id ? "" : id);
  refreshDocs(true);
}
function saveScope() { localStorage.setItem("deephoto_scope", $("scope").value); renderDocs(); }

async function upload() {
  const f = $("file").files[0];
  if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  toast("上传中…");
  const r = await fetch("/api/documents", { method: "POST", body: fd });
  const j = await r.json().catch(() => ({}));
  toast(r.ok ? "已上传,后台处理中" : "上传失败:" + (j.detail || r.status));
  $("file").value = "";
  refreshDocs(true);
}

async function delDoc(id) {
  if (!confirm("删除该文档及其索引与图片?")) return;
  const r = await fetch("/api/documents/" + id, { method: "DELETE" });
  if (!r.ok) { const j = await r.json().catch(() => ({})); toast("删除失败:" + (j.detail || r.status)); }
  if ((localStorage.getItem("deephoto_scope") || "") === id) localStorage.removeItem("deephoto_scope");
  refreshDocs(true);
}

// ---- 会话 ----
function newChat() {
  messages = [];
  localStorage.removeItem("deephoto_chat");
  renderThread();
  $("input").focus();
}

async function send() {
  const question = $("input").value.trim();
  if (!question || sending) return;
  sending = true; $("sendBtn").disabled = true;
  const history = messages.map(m => ({ role: m.role, content: m.content }));
  messages.push({ role: "user", content: question });
  const msg = SEG.createAssistantMessage();
  messages.push(msg);
  $("input").value = ""; autoGrow();
  renderThread();
  try {
    const r = await fetch("/api/qa/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question,
        document_id: localStorage.getItem("deephoto_scope") || null, history }),
    });
    if (!r.ok || !r.body) {
      const j = await r.json().catch(() => ({}));
      msg.error = "请求失败:" + (j.detail || r.status);
      msg.broken = true;
    } else {
      await consumeSSE(r.body, msg);
      SEG.finishStream(msg);   // EOF:无 done 且无 error 才算传输中断;已有答案不撤销
    }
  } catch (e) {
    msg.error = "网络错误:" + e.message;   // 错误独立于正文保存,不拼进 content
    msg.broken = true;
  }
  msg.streaming = false;
  localStorage.setItem("deephoto_chat", JSON.stringify(messages.slice(-60)));
  sending = false; $("sendBtn").disabled = false;
  renderThread();
}

async function consumeSSE(body, msg) {
  const reader = body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
      const line = raw.split("\n").find(l => l.startsWith("data:"));
      if (!line) continue;
      let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
      SEG.applyStreamEvent(msg, ev);   // token/thinking/done/warning/error 的状态迁移在 segments.js
      renderThread();   // token 级刷新;量不大,直接重渲染
    }
  }
}

function renderThread() {
  const box = $("threadInner");
  if (!messages.length) {
    box.innerHTML = `<div class="empty"><div class="logo">📚</div>
      <h2>向你的 PDF 提问</h2>
      <p>先在左侧上传图文 PDF,等待状态变为“就绪”<br>
      回答会附上出处页码,命中配图时在对应段落内嵌完整原图</p></div>`;
    return;
  }
  // 仅当用户原本接近底部时才跟随滚动,图片加载/重渲染不把阅读上文的人拉走
  const thread = $("thread");
  const nearBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 80;
  box.innerHTML = messages.map(m => {
    if (m.role === "user")
      return `<div class="msg user"><div class="avatar">我</div>
        <div class="body"><div class="text">${esc(m.content)}</div></div></div>`;
    const thinking = m.thinking
      ? `<details class="thinking" ${m.streaming ? "open" : ""}><summary>思考过程</summary>
         <div class="think-body">${esc(m.thinking)}</div></details>` : "";
    const cursor = m.streaming && !m.content && !m.thinking
      ? `<div class="typing"><i></i><i></i><i></i></div>` : "";
    const body = SEG.renderAnswerBody(m);   // 正文按标记位置内嵌图片;返回未使用图片给补充区
    const warn = m.warning ? `<div class="warn">⚠️ ${esc(m.warning)}</div>` : "";
    const err = m.error ? `<div class="warn">⚠️ ${esc(m.error)}</div>` : "";
    return `<div class="msg assistant"><div class="avatar">D</div>
      <div class="body">${thinking}
        ${body.html}${m.streaming && m.content ? '<span class="cursor"></span>' : ''}${cursor}
        ${warn}${err}
        ${m.streaming ? "" : renderSupplement(m, body.supplement)}
      </div></div>`;
  }).join("");
  if (nearBottom) requestAnimationFrame(() => { thread.scrollTop = thread.scrollHeight; });
}

// 正文锚点未使用到的已校验图片(例如模型没插图但后端补了候选):末尾"补充图片"区
// 定位命名与正文插图一致(消息 ID + occurrence ID)
function renderSupplement(m, supplement) {
  if (!supplement || !supplement.length) return "";
  return `<div class="supplement"><div class="sup-title">补充图片</div><div class="img-grid">` +
    supplement.map(im => SEG.imageCardHTML(im, m.message_id)).join("") + `</div></div>`;
}

// 图片放大与加载失败都走事件委托/捕获,不把 URL 放进内联 JS
$("threadInner").addEventListener("click", e => {
  const img = e.target.closest("img[data-zoomable]");
  if (img) zoom(img.getAttribute("src"));
});
$("threadInner").addEventListener("error", e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement)) return;
  const card = img.closest(".img-card");
  if (!card) return;
  const err = card.querySelector(".img-err");
  if (err) err.hidden = false;
  img.remove();
}, true);   // error 不冒泡,必须捕获阶段监听

function zoom(url) { $("lightboxImg").src = url; $("lightbox").hidden = false; }

function toast(text) {
  const el = document.createElement("div");
  el.textContent = text;
  el.style.cssText = "position:fixed;left:50%;bottom:96px;transform:translateX(-50%);" +
    "background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:60";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// 全部定义之后再启动轮询(const 暂时性死区:load 会访问 renderDocs/detailLoader)
docPoller.start();
</script>
